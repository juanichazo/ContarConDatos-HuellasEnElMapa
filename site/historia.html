<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Huellas en el mapa — historia visual</title>
<style>body{background:#F3EDE0}#dc-root>div{margin:0 auto}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Caveat:wght@500;600&amp;family=Kalam:wght@400&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Courier+Prime&amp;display=swap">
<style>
body{margin:0}
a{color:#7a2e1f}a:hover{color:#4a1a10}
/* pantallas angostas: el diseño base es de 1080 px; los estilos en línea se pisan con !important */
.h-scroll{overflow-x:auto}
@media (max-width: 900px){
  .h-wrap{padding:40px 20px 48px !important;gap:56px !important}
  .h-h1{font-size:64px !important}
  .h-2col,.h-g2{grid-template-columns:minmax(0,1fr) !important;gap:24px !important}
  .h-g3{grid-template-columns:minmax(0,1fr) !important}
  .h-g4{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  .h-cols{columns:2 !important}
}
@media (max-width: 560px){
  .h-h1{font-size:52px !important}
  .h-cols{columns:1 !important}
}
</style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div class="h-wrap" style="width: 100%; max-width: 1080px; overflow: hidden; box-sizing: border-box; background: var(--papel); color: var(--tinta); font-family: var(--fTexto); font-size: 17px; line-height: 1.45; padding: 72px 72px 64px; display: flex; flex-direction: column; gap: 88px">

<header style="position: relative; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid var(--linea); padding-bottom: 36px">
<svg aria-hidden="true" viewBox="0 0 600 120" style="position: absolute; right: -88px; top: -48px; width: 708px; height: 182px; opacity: 0.25; pointer-events: none; color: var(--tinta)" fill="currentColor"><g transform="translate(40.0 63.0) rotate(80)"><ellipse cx="0" cy="5" rx="5.2" ry="4.3"></ellipse><ellipse cx="-5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse><ellipse cx="-2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse></g><g transform="translate(105.0 65.2) rotate(80)"><ellipse cx="0" cy="5" rx="5.2" ry="4.3"></ellipse><ellipse cx="-5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse><ellipse cx="-2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse></g><g transform="translate(170.0 40.9) rotate(82)"><ellipse cx="0" cy="5" rx="5.2" ry="4.3"></ellipse><ellipse cx="-5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse><ellipse cx="-2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse></g><g transform="translate(235.0 47.3) rotate(85)"><ellipse cx="0" cy="5" rx="5.2" ry="4.3"></ellipse><ellipse cx="-5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse><ellipse cx="-2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse></g><g transform="translate(300.0 29.4) rotate(88)"><ellipse cx="0" cy="5" rx="5.2" ry="4.3"></ellipse><ellipse cx="-5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse><ellipse cx="-2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse></g><g transform="translate(365.0 43.7) rotate(92)"><ellipse cx="0" cy="5" rx="5.2" ry="4.3"></ellipse><ellipse cx="-5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse><ellipse cx="-2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse></g><g transform="translate(430.0 34.0) rotate(96)"><ellipse cx="0" cy="5" rx="5.2" ry="4.3"></ellipse><ellipse cx="-5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse><ellipse cx="-2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse></g><g transform="translate(495.0 56.0) rotate(98)"><ellipse cx="0" cy="5" rx="5.2" ry="4.3"></ellipse><ellipse cx="-5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse><ellipse cx="-2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse></g><g transform="translate(560.0 52.5) rotate(100)"><ellipse cx="0" cy="5" rx="5.2" ry="4.3"></ellipse><ellipse cx="-5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse><ellipse cx="-2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="2" cy="-5.6" rx="1.9" ry="2.5"></ellipse><ellipse cx="5.6" cy="-2.2" rx="1.9" ry="2.4"></ellipse></g><g transform="translate(210.0 104.0) rotate(18)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M0 6 L0 -4 M0 2 L-5 -6 M0 2 L5 -6"></path></g><g transform="translate(253.3 96.7) rotate(42)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M0 6 L0 -4 M0 2 L-5 -6 M0 2 L5 -6"></path></g><g transform="translate(296.7 73.3) rotate(18)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M0 6 L0 -4 M0 2 L-5 -6 M0 2 L5 -6"></path></g><g transform="translate(340.0 66.0) rotate(42)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M0 6 L0 -4 M0 2 L-5 -6 M0 2 L5 -6"></path></g><g transform="translate(383.3 42.7) rotate(18)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M0 6 L0 -4 M0 2 L-5 -6 M0 2 L5 -6"></path></g><g transform="translate(426.7 35.3) rotate(42)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M0 6 L0 -4 M0 2 L-5 -6 M0 2 L5 -6"></path></g><g transform="translate(470.0 12.0) rotate(18)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M0 6 L0 -4 M0 2 L-5 -6 M0 2 L5 -6"></path></g></svg>
<div style="font-family: var(--fDatos); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--tinta2)">Atlas de huellas · Argentina · 2012–2025</div>
<h1 class="h-h1" style="margin: 0; font-family: var(--fTitulo); font-weight: 400; font-size: 96px; line-height: 0.95; letter-spacing: -0.01em">Huellas<br><span style="font-style: italic; color: var(--tintaA)">en el mapa</span></h1>
<p style="margin: 8px 0 0; font-size: 24px; max-width: 760px; line-height: 1.3">Argentina tiene 205 mamíferos y aves en su lista roja oficial. Seguimos sus huellas en 162.717 registros de ciencia ciudadana y colecciones para preguntar dónde viven, dónde los miramos y de cuáles no sabemos casi nada.</p>
<div style="font-family: var(--fNotas); font-size: 26px; color: var(--tintaA); transform: rotate(-1.5deg); transform-origin: left">Un mapa de lo que vemos y de lo que se nos escapa.</div>
</header>

<section style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; gap: 18px; align-items: baseline"><span style="font-family: var(--fDatos); font-size: 14px; color: var(--tintaA)">I.</span><h2 style="margin: 0; font-family: var(--fTitulo); font-weight: 400; font-size: 44px; line-height: 1">La lista</h2></div>
<p style="margin: 0; max-width: 820px">Cada sello es una especie. Las resoluciones nacionales 316/2021 (mamíferos) y 795/2017 (aves) las clasifican en peligro crítico, en peligro o amenazadas. Los sellos punteados son especies sin un solo registro georreferenciado entre 2012 y 2025.</p>
<template data-sc="for" list="{{unidades}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: var(--fDatos); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta2)">{{g.label}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 5px">
<template data-sc="for" list="{{g.items}}" as="u" hint-placeholder-count="40">
<span title="{{u.t}}" data-style="{{u.estilo}}"></span>
</template>
</div>
</div>
</template>
<div style="display: flex; flex-wrap: wrap; gap: 22px; font-size: 14px; color: var(--tinta2)">
<span style="display: flex; gap: 8px; align-items: center"><span data-style="{{muestra.CR}}"></span>En peligro crítico (25)</span>
<span style="display: flex; gap: 8px; align-items: center"><span data-style="{{muestra.EN}}"></span>En peligro (66)</span>
<span style="display: flex; gap: 8px; align-items: center"><span data-style="{{muestra.VU}}"></span>Amenazada ≈ VU (114)</span>
<span style="display: flex; gap: 8px; align-items: center"><span data-style="{{muestra.vacia}}"></span>Sin registros 2012–2025 (65)</span>
</div>
</section>

<section class="h-2col" style="display: grid; grid-template-columns: 460px minmax(0, 1fr); gap: 48px; align-items: start">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
<img src="img/m1_riqueza.jpg" alt="Mapa de Argentina en hexágonos: cantidad de especies amenazadas registradas entre 2012 y 2024; el máximo está en Misiones" style="width: 460px; max-width: 100%; height: auto; display: block; border: 1px solid var(--linea)">
<figcaption style="font-size: 13px; color: var(--tinta2)">Especies amenazadas registradas por hexágono (H3 res. 4), 2012–2024. Solo registros en tierra.</figcaption>
</figure>
<div style="display: flex; flex-direction: column; gap: 18px; padding-top: 8px">
<div style="display: flex; gap: 18px; align-items: baseline"><span style="font-family: var(--fDatos); font-size: 14px; color: var(--tintaA)">II.</span><h2 style="margin: 0; font-family: var(--fTitulo); font-weight: 400; font-size: 44px; line-height: 1">Dónde se las vio</h2></div>
<p style="margin: 0">Entre 2012 y 2024 hubo registros de especies amenazadas en 2.015 celdas del territorio. La mayoría guarda una o dos especies; pocas concentran muchas.</p>
<div style="border-left: 2px solid var(--tintaA); padding-left: 16px; display: flex; flex-direction: column; gap: 4px">
<div style="font-family: var(--fTitulo); font-size: 56px; line-height: 1; color: var(--tintaA)">34</div>
<div>especies amenazadas registradas en una sola celda de la Selva Paranaense, en el norte de Misiones: el máximo del país.</div>
</div>
<p style="margin: 0">Las cinco celdas más ricas están en la Selva Paranaense, los bosques de araucaria y los Esteros del Iberá. Los Andes y la costa patagónica dibujan las otras dos franjas oscuras.</p>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">
<template data-sc="for" list="{{escala}}" as="e" hint-placeholder-count="4">
<div style="display: flex; gap: 10px; align-items: center"><span data-style="{{e.muestra}}"></span><span>{{e.label}}</span></div>
</template>
</div>
<div style="font-family: var(--fNotas); font-size: 22px; color: var(--tintaA); line-height: 1.2">Pero ¿es ahí donde viven… o donde hay más gente mirando?</div>
</div>
</section>

<section class="h-2col" style="display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 48px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 18px; padding-top: 8px">
<div style="display: flex; gap: 18px; align-items: baseline"><span style="font-family: var(--fDatos); font-size: 14px; color: var(--tintaA)">III.</span><h2 style="margin: 0; font-family: var(--fTitulo); font-weight: 400; font-size: 44px; line-height: 1">Dónde se mira</h2></div>
<p style="margin: 0">Un registro es alguien que vio un animal y lo anotó. Por eso los datos crecen con la cantidad de observadores, no con la de animales: de 2.832 registros en 2012 a 28.420 en 2024.</p>
<div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; align-items: end; height: 150px">
<template data-sc="for" list="{{anios}}" as="b" hint-placeholder-count="14">
<div title="{{b.t}}" data-style="{{b.estilo}}"></div>
</template>
</div>
<div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; font-family: var(--fDatos); font-size: 10px; color: var(--tinta2); text-align: center">
<template data-sc="for" list="{{anios}}" as="b" hint-placeholder-count="14"><span>{{b.corto}}</span></template>
</div>
<div style="font-size: 13px; color: var(--tinta2)">Registros únicos por año. 2025 (punteado) todavía no está completo.</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="border-top: 1px solid var(--linea); padding-top: 8px"><div style="font-family: var(--fTitulo); font-size: 44px; line-height: 1">81 %</div><div style="font-size: 15px">de los registros cae en el 10 % de las celdas más visitadas.</div></div>
<div style="border-top: 1px solid var(--linea); padding-top: 8px"><div style="font-family: var(--fTitulo); font-size: 44px; line-height: 1">92 %</div><div style="font-size: 15px">de los registros viene de una sola plataforma de observadores de aves (eBird).</div></div>
</div>
</div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
<img src="img/m2_esfuerzo.jpg" alt="Mapa de Argentina en hexágonos grises: cantidad de registros por celda en escala logarítmica" style="width: 460px; max-width: 100%; height: auto; display: block; border: 1px solid var(--linea)">
<figcaption style="font-size: 13px; color: var(--tinta2)">Cantidad de registros por hexágono, 2012–2024 (escala logarítmica: más oscuro = muchos más registros).</figcaption>
</figure>
</section>

<section style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; gap: 18px; align-items: baseline"><span style="font-family: var(--fDatos); font-size: 14px; color: var(--tintaA)">IV.</span><h2 style="margin: 0; font-family: var(--fTitulo); font-weight: 400; font-size: 44px; line-height: 1">La mirada crece</h2></div>
<p style="margin: 0; max-width: 820px">Tres períodos, la misma pregunta. Cada vez hay más celdas con registros y más especies detectadas. No es que aparezcan animales: es que aparecen ojos.</p>
<div class="h-g3" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
<template data-sc="for" list="{{periodos}}" as="p" hint-placeholder-count="3">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: var(--fNotas); font-size: 26px; color: var(--tintaA)">{{p.label}}</div>
<img src="{{p.src}}" alt="{{p.alt}}" style="width: 100%; height: auto; display: block; border: 1px solid var(--linea)">
<figcaption style="display: flex; justify-content: space-between; font-size: 14px"><span><b>{{p.celdas}}</b> celdas</span><span><b>{{p.sp}}</b> especies</span><span><b>{{p.rec}}</b> registros</span></figcaption>
</figure>
</template>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; gap: 18px; align-items: baseline"><span style="font-family: var(--fDatos); font-size: 14px; color: var(--tintaA)">V.</span><h2 style="margin: 0; font-family: var(--fTitulo); font-weight: 400; font-size: 44px; line-height: 1">Cuatro huellas</h2></div>
<p style="margin: 0; max-width: 820px">Cada punto es un lugar (≈1 km) con al menos un registro entre 2012 y 2024; su tamaño crece con la cantidad. Detrás, en rosado, las celdas que ocupa.</p>
<div class="h-g4" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
<template data-sc="for" list="{{retratos}}" as="r" hint-placeholder-count="4">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
<img src="{{r.src}}" alt="{{r.alt}}" style="width: 100%; height: auto; display: block; border: 1px solid var(--linea)">
<div style="background: var(--papel2); border: 1px solid var(--tinta); outline: 1px solid var(--linea); outline-offset: 3px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
<div style="font-family: var(--fDatos); font-size: 10px; color: var(--tinta2)">{{r.cat}}</div>
<div style="font-family: var(--fTitulo); font-size: 22px; line-height: 1.05">{{r.com}}</div>
<div style="font-style: italic; font-size: 14px">{{r.cie}}</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><span data-style="{{r.sello}}">{{r.nac}}</span><span data-style="{{r.selloU}}">{{r.uicn}}</span></div>
<div style="font-size: 13px">{{r.datos}}</div>
<div style="font-family: var(--fNotas); font-size: 17px; color: var(--tintaA); line-height: 1.15">{{r.nota}}</div>
</div>
</figure>
</template>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; gap: 18px; align-items: baseline"><span style="font-family: var(--fDatos); font-size: 14px; color: var(--tintaA)">VI.</span><h2 style="margin: 0; font-family: var(--fTitulo); font-weight: 400; font-size: 44px; line-height: 1">Sin huellas</h2></div>
<p style="margin: 0; max-width: 820px">Estas 65 especies están en la lista roja y no tienen ni un registro georreferenciado en 14 años. Son sobre todo roedores, murciélagos y marsupiales. Diez están en peligro crítico.</p>
<div class="h-cols" style="columns: 3; column-gap: 32px; font-size: 15px">
<template data-sc="for" list="{{vacias}}" as="v" hint-placeholder-count="20">
<div style="break-inside: avoid; display: flex; gap: 8px; align-items: baseline; padding: 3px 0; border-bottom: 1px dotted var(--linea)"><span data-style="{{v.sello}}">{{v.nac}}</span><span>{{v.com}} <i style="color: var(--tinta2)">{{v.cie}}</i></span></div>
</template>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 18px; align-items: baseline"><span style="font-family: var(--fDatos); font-size: 14px; color: var(--tintaA)">VII.</span><h2 style="margin: 0; font-family: var(--fTitulo); font-weight: 400; font-size: 36px; line-height: 1">Lo que le pasa a la casa</h2></div>
<p style="margin: 0; max-width: 860px">Las ecorregiones con más especies amenazadas registradas no son las más protegidas. En la Pampa húmeda y el Espinal, menos del 4 % de la tierra está bajo alguna área protegida, y casi nada con protección estricta. Los focos de calor se concentran en el Delta, los bosques de araucaria, el Chaco húmedo y los esteros del Iberá.</p>
<div class="h-scroll"><div style="min-width: 760px; display: grid; grid-template-columns: 250px 120px minmax(0, 1fr) minmax(0, 1fr); gap: 6px 14px; align-items: center; font-size: 14px">
<div style="font-family: var(--fDatos); font-size: 11px; color: var(--tinta2); text-transform: uppercase">Ecorregión</div>
<div style="font-family: var(--fDatos); font-size: 11px; color: var(--tinta2); text-transform: uppercase">Especies</div>
<div style="font-family: var(--fDatos); font-size: 11px; color: var(--tinta2); text-transform: uppercase">% bajo área protegida · ■ estricta</div>
<div style="font-family: var(--fDatos); font-size: 11px; color: var(--tinta2); text-transform: uppercase">Focos de calor / 1.000 km² / año</div>
<template data-sc="for" list="{{cruce.filas}}" as="r" hint-placeholder-count="15">
<div>{{r.nom}}</div>
<div style="display: flex; gap: 6px; align-items: center"><span data-style="{{r.barSp}}"></span><span style="font-family: var(--fDatos); font-size: 12px">{{r.sp}}</span></div>
<div style="display: flex; gap: 6px; align-items: center"><span data-style="{{r.barAp}}"><span data-style="{{r.barApE}}"></span></span><span style="font-family: var(--fDatos); font-size: 12px">{{r.ap}}</span></div>
<div style="display: flex; gap: 6px; align-items: center"><span data-style="{{r.barFu}}"></span><span style="font-family: var(--fDatos); font-size: 12px">{{r.fu}}</span></div>
</template>
</div></div>
<div class="h-g4" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; border-top: 1px dotted var(--linea); padding-top: 14px">
<template data-sc="for" list="{{cruce.perd}}" as="q" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: var(--fTitulo); font-size: 30px; color: var(--tintaA); line-height: 1">{{q.d}}</span><span style="font-size: 13px">mil ha de bosque · {{q.nom}}</span><span style="font-family: var(--fDatos); font-size: 11px; color: var(--tinta2)">{{q.pct}} del bosque de 2012</span></div>

</div>
