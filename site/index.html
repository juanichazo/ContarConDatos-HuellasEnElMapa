<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huellas en el mapa</title>
<link rel="stylesheet" href="assets/maplibre-gl.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Caveat:wght@500;600&amp;family=Kalam:wght@400&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Courier+Prime&amp;display=swap">
<style>
body{margin:0}
a{color:#7a2e1f}a:hover{color:#4a1a10}
select,button,input{font:inherit;color:inherit}
.maplibregl-popup-content{background:#fbf8f1;color:#2b241d;border:1px solid #b9a98f;border-radius:2px;box-shadow:0 2px 0 rgba(43,36,29,.15);font-size:13px;line-height:1.35;padding:8px 10px}
.maplibregl-popup-tip{border-top-color:#b9a98f !important}
.maplibregl-ctrl-attrib{background:rgba(251,248,241,.85) !important;font-size:10px}
.maplibregl-ctrl-group{background:#fbf8f1;border:1px solid #b9a98f;border-radius:2px;box-shadow:none}
input[type=range]{accent-color:#7a2e1f}
</style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">


<div style="min-height: 100vh; background: {{papel}}; color: {{tinta}}; font-family: {{fTexto}}; font-size: 16px; line-height: 1.45">
<div style="max-width: 1560px; margin: 0 auto; padding: 28px 32px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; position: relative">
<header style="position: relative; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid {{linea}}; padding-bottom: 14px">

<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="font-family: {{fDatos}}; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: {{tinta2}}">Atlas de huellas · Argentina · 2012–2025</div>
<h1 style="position: relative; margin: 0; font-family: {{fTitulo}}; font-weight: 400; font-size: 52px; line-height: 1.0; letter-spacing: -0.01em">Huellas <span style="font-style: italic; color: {{tintaA}}">en el mapa</span></h1>
<p style="margin: 4px 0 0; font-size: 19px; max-width: 760px">¿Dónde viven las especies amenazadas de Argentina y qué le pasa al territorio que habitan?</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<div style="border-left: 2px solid {{tinta}}; padding: 2px 12px"><div style="font-family: {{fTitulo}}; font-size: 30px; line-height: 1">{{k.especies}}</div><div style="font-size: 12px; color: {{tinta2}}">especies amenazadas</div></div>
<div style="border-left: 2px solid {{tinta}}; padding: 2px 12px"><div style="font-family: {{fTitulo}}; font-size: 30px; line-height: 1">{{k.registros}}</div><div style="font-size: 12px; color: {{tinta2}}">registros 2012–2025</div></div>
<div style="border-left: 2px dashed {{tintaA}}; padding: 2px 12px"><div style="font-family: {{fTitulo}}; font-size: 30px; line-height: 1; color: {{tintaA}}">{{k.vacias}}</div><div style="font-size: 12px; color: {{tinta2}}">sin ningún registro</div></div>
</div>
</header>
<nav aria-label="Índice" style="position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; padding: 6px 0; background: {{papel}}; border-bottom: 1px solid {{linea}}">
<span style="font-family: {{fDatos}}; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: {{tinta2}}; margin-right: 8px">Índice</span>
<template data-sc="for" list="{{indice}}" as="i" hint-placeholder-count="8"><button type="button" onClick="{{i.pick}}" style="background: none; border: 0; padding: 6px 8px; min-height: 34px; cursor: pointer; font-size: 14px; color: {{tinta}}"><span style="font-family: {{fDatos}}; font-size: 11px; color: {{tintaA}}; margin-right: 4px">{{i.n}}</span>{{i.label}}</button></template>
</nav>
<section id="sec-mensaje" style="scroll-margin-top: 56px; display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center; padding: 16px 20px; border-left: 3px solid {{tintaA}}; background: {{papel2}}">
<span style="font-family: {{fDatos}}; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: {{tinta2}}">El mensaje</span>
<p style="margin: 0; flex: 1 1 560px; font-family: {{fTitulo}}; font-size: 25px; line-height: 1.25">{{msg.texto}}</p>
<button type="button" onClick="{{msg.ver}}" style="min-height: 40px; padding: 6px 14px; border: 1px solid {{tinta}}; background: {{tinta}}; color: {{papel2}}; border-radius: 2px; cursor: pointer; font-size: 14px">Ver los vacíos en el mapa</button>
</section>
<div id="sec-mapa" style="display: flex; align-items: center; gap: 12px; margin-top: 8px; scroll-margin-top: 56px; font-family: {{fDatos}}; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: {{tinta2}}"><span style="color: {{tintaA}}">01</span><span>El mapa</span><span style="flex: 1; height: 1px; background: {{linea}}"></span></div><div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<aside style="flex: 1 1 260px; max-width: 300px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section style="display: flex; flex-direction: column; gap: 8px">
<label for="sel-sp" style="font-family: {{fDatos}}; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: {{tinta2}}">Buscar especie</label>
<select id="sel-sp" value="{{sp}}" onChange="{{onSp}}" style="width: 100%; padding: 8px; background: {{papel2}}; border: 1px solid {{linea}}; border-radius: 2px; min-height: 42px">
<option value="">Todas las especies (filtradas)</option>
<template data-sc="for" list="{{opciones}}" as="o" hint-placeholder-count="6"><option value="{{o.id}}">{{o.label}}</option></template>
</select>
<select id="sel-sp2" aria-label="Comparar con otra especie" value="{{sp2}}" onChange="{{onSp2}}" style="width: 100%; padding: 8px; background: {{papel2}}; border: 1px solid {{linea}}; border-radius: 2px; min-height: 42px">
<option value="">Comparar con… (opcional)</option>
<template data-sc="for" list="{{opciones}}" as="o" hint-placeholder-count="6"><option value="{{o.id}}">{{o.label}}</option></template>
</select>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: {{fDatos}}; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: {{tinta2}}">Filtrar</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{grupos}}" as="g" hint-placeholder-count="3"><button type="button" onClick="{{g.pick}}" aria-pressed="{{g.on}}" style="{{g.estilo}}">{{g.label}}</button></template></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{catsUI}}" as="c" hint-placeholder-count="3"><button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.estilo}}">{{c.label}}</button></template></div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: {{fDatos}}; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: {{tinta2}}">Tiempo</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{modos}}" as="m" hint-placeholder-count="3"><button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.estilo}}">{{m.label}}</button></template></div>
<template data-sc="if" value="{{noComparar}}" hint-placeholder-val="{{ true }}">
<label for="rng-anio" style="font-size: 14px">{{textoAnio}}</label>
<div style="display: flex; gap: 8px; align-items: center">
<button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="min-width: 40px; min-height: 40px; border: 1px solid {{linea}}; background: {{papel2}}; border-radius: 2px; cursor: pointer">
<template data-sc="if" value="{{playing}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"></rect><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"></rect></svg></template>
<template data-sc="if" value="{{noPlaying}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2 L13 8 L4 14 Z" fill="currentColor"></path></svg></template>
</button>
<input id="rng-anio" type="range" min="2012" max="2025" step="1" value="{{anio}}" onChange="{{onAnio}}" style="flex: 1; min-width: 0">
</div>
</template>
<template data-sc="if" value="{{esComparar}}" hint-placeholder-val="{{ false }}">
<label for="rng-a" style="font-size: 14px">Año A: <b>{{anioA}}</b> <span style="color: {{tintaA}}">●</span></label>
<input id="rng-a" type="range" min="2012" max="2025" step="1" value="{{anioA}}" onChange="{{onAnioA}}">
<label for="rng-b" style="font-size: 14px">Año B: <b>{{anioB}}</b> <span style="color: {{tintaB}}">●</span></label>
<input id="rng-b" type="range" min="2012" max="2025" step="1" value="{{anioB}}" onChange="{{onAnioB}}">
</template>
<div style="font-family: {{fNotas}}; font-size: 16px; color: {{tintaA}}; line-height: 1.2">Más registros = más gente mirando, no más animales. 2025 está incompleto.</div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: {{fDatos}}; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: {{tinta2}}">Presión de fondo</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{presUI}}" as="b" hint-placeholder-count="3"><button type="button" onClick="{{b.pick}}" aria-pressed="{{b.on}}" style="{{b.estilo}}">{{b.label}}</button></template></div>
<template data-sc="if" value="{{presEsAP}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 8px; border-left: 2px solid {{linea}}; padding-left: 10px">
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{apTipoUI}}" as="b" hint-placeholder-count="2"><button type="button" onClick="{{b.pick}}" aria-pressed="{{b.on}}" style="{{b.estilo}}">{{b.label}}</button></template></div>
<div style="font-size: 13px; color: {{tinta2}}">Una celda cuenta como protegida si tiene:</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{umbralUI}}" as="b" hint-placeholder-count="3"><button type="button" onClick="{{b.pick}}" aria-pressed="{{b.on}}" style="{{b.estilo}}">{{b.label}}</button></template></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{vaciosUI}}" as="b" hint-placeholder-count="2"><button type="button" onClick="{{b.pick}}" aria-pressed="{{b.on}}" style="{{b.estilo}}">{{b.label}}</button></template></div>
<template data-sc="if" value="{{hayGap}}" hint-placeholder-val="{{ false }}"><details style="font-size: 14px"><summary style="cursor: pointer; color: {{tintaA}}">{{gapTitulo}}</summary>
<div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; max-height: 200px; overflow: auto"><template data-sc="for" list="{{gapLista}}" as="g" hint-placeholder-count="6"><button type="button" onClick="{{g.pick}}" style="font-size: 12px; padding: 3px 7px; border: 1px solid {{linea}}; background: {{papel}}; border-radius: 2px; cursor: pointer">{{g.t}}</button></template></div>
</details></template>
</div></template>
<div style="font-size: 13px; color: {{tinta2}}">{{presNota}}</div>
</section>
<section style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: {{fDatos}}; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: {{tinta2}}">Celdas</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{formaUI}}" as="b" hint-placeholder-count="2"><button type="button" onClick="{{b.pick}}" aria-pressed="{{b.on}}" style="{{b.estilo}}">{{b.label}}</button></template></div>
<div style="font-size: 13px; color: {{tinta2}}">{{formaNota}}</div>
<div style="font-family: {{fDatos}}; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: {{tinta2}}; margin-top: 6px">Láminas</div>
<template data-sc="for" list="{{capasUI}}" as="c" hint-placeholder-count="6">
<label style="display: flex; gap: 8px; align-items: center; min-height: 30px; font-size: 14px"><input type="checkbox" checked="{{c.on}}" onChange="{{c.toggle}}" style="width: 17px; height: 17px"><span>{{c.label}}</span></label>
</template>
<template data-sc="for" list="{{pendientes}}" as="c" hint-placeholder-count="2">
<div style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: {{tinta2}}"><input type="checkbox" disabled="{{ true }}" aria-label="{{c.label}} (en preparación)" style="width: 17px; height: 17px; margin-top: 2px"><div><div>{{c.label}}</div><div style="font-family: {{fDatos}}; font-size: 11px">en preparación · {{c.fuente}}</div></div></div>
</template>
</section>
</aside>
<main style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column">
<div style="position: relative; border: 1px solid {{linea}}; background: {{papel2}}; height: 760px">
<div ref="{{mapRef}}" style="position: absolute; inset: 0"></div>
<template data-sc="if" value="{{cargando}}" hint-placeholder-val="{{ true }}"><div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: {{fNotas}}; font-size: 24px; color: {{tinta2}}">Siguiendo huellas…</div></template>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px 36px; align-items: flex-start; border: 1px solid {{linea}}; border-top: 0; background: {{papel2}}; padding: 10px 14px; font-size: 13px">
<div style="display: flex; flex-direction: column; gap: 5px; min-width: 220px">
<div style="font-family: {{fDatos}}; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: {{tinta2}}">{{leyenda.titulo}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center"><template data-sc="for" list="{{leyenda.items}}" as="it" hint-placeholder-count="4"><span style="display: flex; gap: 6px; align-items: center"><span style="{{it.muestra}}"></span><span>{{it.label}}</span></span></template></div>
<div style="color: {{tinta2}}">{{leyenda.nota}}</div>
</div>
<template data-sc="if" value="{{leyP.on}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 5px; min-width: 240px">
<div style="font-family: {{fDatos}}; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: {{tinta2}}">{{leyP.titulo}}</div>
<div style="display: flex; gap: 2px; width: 260px"><template data-sc="for" list="{{leyP.items}}" as="it" hint-placeholder-count="5"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 11px; font-family: {{fDatos}}"><span style="{{it.muestra}}"></span><span>{{it.label}}</span></div></template></div>
<div style="color: {{tinta2}}">Debajo de los puntos de especies.</div>
</div>
</template>
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px; text-align: right; color: {{tinta2}}">
<span style="font-size: 14px; color: {{tinta}}">{{estado}}</span>
<span>Clic en una ecorregión: su ficha · cursor: detalle · rueda o pellizco: zoom</span>
</div>
</div>
</main>
</div>
<div id="sec-ficha" style="display: flex; align-items: center; gap: 12px; margin-top: 8px; scroll-margin-top: 56px; font-family: {{fDatos}}; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: {{tinta2}}"><span style="color: {{tintaA}}">02</span><span>Ficha y años</span><span style="flex: 1; height: 1px; background: {{linea}}"></span></div><div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 1 1 340px; max-width: 440px; min-width: 0"><div style="display: flex; flex-direction: column; gap: 14px">
<template data-sc="if" value="{{ficha.esEspecie}}" hint-placeholder-val="{{ false }}">
<article style="background: {{papel2}}; border: 1px solid {{tinta}}; outline: 1px solid {{linea}}; outline-offset: 3px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; font-family: {{fDatos}}; font-size: 11px; color: {{tinta2}}"><span>LISTA ROJA · ARGENTINA</span><span>{{ficha.catalogo}}</span></div>
<h2 style="margin: 0; font-family: {{fTitulo}}; font-weight: 400; font-size: 30px; line-height: 1.05">{{ficha.comun}}</h2>
<div style="font-style: italic; font-size: 18px">{{ficha.cientifico}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="{{ficha.selloNac}}">{{ficha.nacTxt}}</span>
<span style="{{ficha.selloUicn}}">{{ficha.uicnTxt}}</span>
</div>
<div style="font-size: 14px; color: {{tinta2}}">{{ficha.grupo}}{{ficha.marino}}</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; border-top: 1px dotted {{linea}}; padding-top: 8px">
<div><div style="font-family: {{fTitulo}}; font-size: 26px">{{ficha.n}}</div><div style="font-size: 12px; color: {{tinta2}}">registros 2012–2025</div></div>
<div><div style="font-family: {{fTitulo}}; font-size: 26px">{{ficha.nh}}</div><div style="font-size: 12px; color: {{tinta2}}">hexágonos con registro</div></div>
</div>
<div>
<div style="font-size: 12px; color: {{tinta2}}; margin-bottom: 4px">Detectada por año (2012 → 2025)</div>
<div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 2px; height: 26px">
<template data-sc="for" list="{{ficha.barras}}" as="b" hint-placeholder-count="14">
<span title="{{b.t}}" style="{{b.estilo}}"></span>
</template>
</div>
</div>
<div style="font-size: 14px"><b>Ecorregiones:</b> {{ficha.ecos}}</div>
<div style="font-size: 13px; color: {{tinta2}}">{{ficha.rango}}</div>
<div style="font-family: {{fNotas}}; font-size: 18px; color: {{tintaA}}; line-height: 1.2">{{ficha.nota}}</div>
<button type="button" onClick="{{limpiarSp}}" style="align-self: flex-start; min-height: 40px; padding: 6px 12px; border: 1px solid {{linea}}; background: {{papel}}; border-radius: 2px; cursor: pointer">Volver al conjunto</button>
</article>
</template>
<template data-sc="if" value="{{ficha.esEco}}" hint-placeholder-val="{{ false }}">
<article style="background: {{papel2}}; border: 1px solid {{tinta}}; outline: 1px solid {{linea}}; outline-offset: 3px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="font-family: {{fDatos}}; font-size: 11px; color: {{tinta2}}">ECORREGIÓN · {{ficha.ecoId}}</div>
<h2 style="margin: 0; font-family: {{fTitulo}}; font-weight: 400; font-size: 28px; line-height: 1.05">{{ficha.ecoNombre}}</h2>
<div style="font-size: 14px; color: {{tinta2}}">{{ficha.ecoArea}} km² · RESOLVE: {{ficha.ecoOrig}}</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1px dotted {{linea}}; padding-top: 8px; text-align: center">
<div><div style="font-family: {{fTitulo}}; font-size: 26px">{{ficha.ecoCR}}</div><div style="font-size: 12px">en peligro crítico</div></div>
<div><div style="font-family: {{fTitulo}}; font-size: 26px">{{ficha.ecoEN}}</div><div style="font-size: 12px">en peligro</div></div>
<div><div style="font-family: {{fTitulo}}; font-size: 26px">{{ficha.ecoVU}}</div><div style="font-size: 12px">amenazadas</div></div>
</div>
<div style="font-size: 12px; color: {{tinta2}}">Especies detectadas cada año (todas las amenazadas)</div>
<div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; align-items: end; height: 70px">
<template data-sc="for" list="{{ficha.ecoSerie}}" as="b" hint-placeholder-count="14">
<span title="{{b.t}}" style="{{b.estilo}}"></span>
</template>
</div>
<div style="font-size: 14px; max-height: 180px; overflow: auto"><b>Con registros (según filtros):</b> {{ficha.ecoEspecies}}</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; border-top: 1px dotted {{linea}}; padding-top: 8px">
<div><div style="font-family: {{fTitulo}}; font-size: 24px">{{ficha.ecoAP}}</div><div style="font-size: 12px; color: {{tinta2}}">bajo área protegida en {{ficha.ecoAnio}} ({{ficha.ecoAPe}} estricta)</div></div>
<div><div style="font-family: {{fTitulo}}; font-size: 24px">{{ficha.ecoFu}}</div><div style="font-size: 12px; color: {{tinta2}}">focos de calor VIIRS por 1.000 km² y año ({{ficha.ecoVent}})</div></div>
</div>
<div style="font-size: 12px; color: {{tinta2}}">Focos de calor por año, 2012 → 2025</div>
<div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; align-items: end; height: 48px">
<template data-sc="for" list="{{ficha.ecoFuSerie}}" as="b" hint-placeholder-count="14">
<span title="{{b.t}}" style="{{b.estilo}}"></span>
</template>
</div>
<div style="font-size: 12px; color: {{tinta2}}">Desmonte (MapBiomas) usa otro mapa de ecorregiones (Burkart): ver la pestaña «Presiones».</div>
<button type="button" onClick="{{limpiarEco}}" style="align-self: flex-start; min-height: 40px; padding: 6px 12px; border: 1px solid {{linea}}; background: {{papel}}; border-radius: 2px; cursor: pointer">Cerrar ficha</button>
</article>
</template>
<template data-sc="if" value="{{ficha.esGuia}}" hint-placeholder-val="{{ true }}">
<article style="border: 1px solid {{linea}}; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: {{papel2}}">
<h2 style="margin: 0; font-family: {{fTitulo}}; font-weight: 400; font-size: 26px">Cómo leer este mapa</h2>
<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px">
<li>Cada hexágono es una celda del territorio. Su tinta indica cuántas especies amenazadas fueron registradas ahí en la ventana de tiempo elegida.</li>
<li>Elegí una especie para ver su ficha y dónde fue registrada; sumá una segunda para comparar en dos tintas.</li>
<li>En «Comparar años», cada celda dice si hubo registros solo en el año A, solo en el B o en ambos.</li>
<li>Los registros miden dónde se miró, no cuántos animales hay. Las hojas vacías también son un dato.</li>
<li>En «Presión de fondo» pintá áreas protegidas o focos de calor debajo: las celdas con especies quedan con contorno rojo.</li>
</ol>

<div style="font-size: 13px; color: {{tinta2}}; max-width: 900px">Un foco de calor es una detección satelital de una anomalía térmica, no un incendio ni una superficie quemada; los incendios de bosque andino-patagónico ocupan poca superficie y casi no se notan en focos por km². La superficie quemada del SNMF es el dato oficial, pero 2012–2016 y 2017–2025 vienen de dos tablas que no siempre coinciden en los años en común; gris = sin dato. MapBiomas: el salto 2024→2025 y la ganancia de vegetación «natural» en la Pampa pueden reflejar cambios de clasificación entre pasturas y pastizales; leer con cautela. Áreas protegidas: Tomba (2025) no incluye áreas creadas después de 2022.</div>
