<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Huellas en el mapa</title>
<link rel="stylesheet" href="assets/maplibre-gl.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Caveat:wght@500;600&amp;family=Kalam:wght@400&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Courier+Prime&amp;display=swap">
<style>
body{margin:0}
a{color:#7a2e1f}a:hover{color:#4a1a10}
select,button,input{font:inherit;color:inherit}
.maplibregl-popup-content{background:#fbf8f1;color:#2b241d;border:1px solid #b9a98f;border-radius:2px;box-shadow:0 2px 0 rgba(43,36,29,.15);font-size:13px;line-height:1.35;padding:8px 10px}
.maplibregl-popup-tip{border-top-color:#b9a98f !important}
.maplibregl-ctrl-attrib{background:rgba(251,248,241,.85) !important;font-size:10px}
.maplibregl-ctrl-group{background:#fbf8f1;border:1px solid #b9a98f;border-radius:2px;box-shadow:none}
input[type=range],input[type=checkbox]{accent-color:#7a2e1f}
.tarjeta-mapa{position:absolute;pointer-events:auto;box-sizing:border-box;background:rgba(251,248,241,.96);border:1px solid var(--linea);outline:1px solid rgba(185,169,143,.5);outline-offset:2px;box-shadow:0 2px 0 rgba(43,36,29,.15)}
.tarjeta-guia{top:10px;right:10px;width:min(420px,calc(100% - 20px))}
.tarjeta-ficha{top:10px;right:10px;width:min(330px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto}
.tarjeta-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:1;min-width:0;min-height:38px;padding:6px 10px;background:none;border:0;cursor:pointer;text-align:left;color:inherit}
.tarjeta-signo{flex:0 0 auto;font-family:var(--fDatos);font-size:15px;color:var(--tinta2)}
.tarjeta-x{flex:0 0 auto;min-width:38px;background:none;border:0;border-left:1px solid var(--linea);cursor:pointer;font-size:14px;color:var(--tinta2)}
@media (max-width:759px){.tarjeta-ficha{top:auto;bottom:10px;left:10px;right:56px;width:auto;max-height:60%}}
.tabla-fija thead th{position:sticky;top:0;z-index:3;background:var(--papel2);box-shadow:inset 0 -1px 0 var(--linea)}
</style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">


<div style="min-height: 100vh; overflow-x: clip; background: var(--papel); color: var(--tinta); font-family: var(--fTexto); font-size: 16px; line-height: 1.45">
<div style="max-width: 1560px; margin: 0 auto; padding: 14px 32px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; position: relative">
<header style="position: relative; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid var(--linea); padding-bottom: 14px">

<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<nav aria-label="Índice" style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 2px">
<template data-sc="for" list="{{indice}}" as="i" hint-placeholder-count="8"><button type="button" onClick="{{i.pick}}" style="background: none; border: 0; padding: 2px 8px 2px 0; min-height: 24px; cursor: pointer; font-size: 14px; color: var(--tinta)"><span style="font-family: var(--fDatos); font-size: 11px; color: var(--tintaA); margin-right: 4px">{{i.n}}</span>{{i.label}}</button></template>
</nav>
<h1 style="position: relative; margin: 0; font-family: var(--fTitulo); font-weight: 400; font-size: 40px; line-height: 1.0; letter-spacing: -0.01em">Huellas <span style="font-style: italic; color: var(--tintaA)">en el mapa</span></h1>
<p style="margin: 2px 0 0; font-size: 16px; max-width: 760px">¿Dónde viven las especies amenazadas de Argentina y qué le pasa al territorio que habitan?</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<div style="border-left: 2px solid var(--tinta); padding: 2px 12px"><div style="font-family: var(--fTitulo); font-size: 30px; line-height: 1">{{k.especies}}</div><div style="font-size: 12px; color: var(--tinta2)">especies amenazadas</div></div>
<div style="border-left: 2px solid var(--tinta); padding: 2px 12px"><div style="font-family: var(--fTitulo); font-size: 30px; line-height: 1">{{k.registros}}</div><div style="font-size: 12px; color: var(--tinta2)">registros 2012–2025</div></div>
<div style="border-left: 2px dashed var(--tintaA); padding: 2px 12px"><div style="font-family: var(--fTitulo); font-size: 30px; line-height: 1; color: var(--tintaA)">{{k.vacias}}</div><div style="font-size: 12px; color: var(--tinta2)">sin ningún registro</div></div>
</div>
</header>
<section id="sec-mensaje" style="scroll-margin-top: 56px; display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: center; padding: 8px 16px; border-left: 3px solid var(--tintaA); background: var(--papel2)">
<p style="margin: 0; flex: 1 1 600px; font-family: var(--fTitulo); font-size: 18px; line-height: 1.25">{{msg.texto}}</p>
</section>
<div id="sec-mapa" style="display: flex; align-items: center; gap: 12px; margin-top: 8px; scroll-margin-top: 56px; font-family: var(--fDatos); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--tinta2)"><span style="color: var(--tintaA)">01</span><span>El mapa</span><span style="flex: 1; height: 1px; background: var(--linea)"></span></div>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<aside style="flex: 0 0 390px; max-width: 100%; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: var(--fDatos); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta2)">Buscar especie</div>
<div class="combo" style="position: relative">
<input id="sel-sp" type="text" role="combobox" aria-label="{{cb1.aria}}" aria-expanded="{{cb1.abierto}}" aria-controls="lista-sp" aria-autocomplete="list" aria-activedescendant="{{cb1.activo}}" placeholder="{{cb1.ph}}" value="{{cb1.texto}}" onInput="{{cb1.escribir}}" onClick="{{cb1.abrir}}" onKeydown="{{cb1.tecla}}" autocomplete="off" spellcheck="false" style="width: 100%; box-sizing: border-box; padding: 8px 32px 8px 10px; background: var(--papel2); border: 1px solid var(--linea); border-radius: 2px; min-height: 42px; text-overflow: ellipsis">
<span aria-hidden="true" style="position: absolute; right: 11px; top: 12px; font-size: 12px; color: var(--tinta2); pointer-events: none">▾</span>
<template data-sc="if" value="{{cb1.abierto}}" hint-placeholder-val="{{ false }}"><div id="lista-sp" role="listbox" style="position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 2px); max-height: 340px; overflow: auto; background: var(--papel2); border: 1px solid var(--linea); border-radius: 2px; box-shadow: 0 4px 12px rgba(43, 36, 29, 0.18)">
<template data-sc="for" list="{{cb1.items}}" as="o" hint-placeholder-count="6"><div id="{{o.dom}}" role="option" aria-selected="{{o.on}}" onClick="{{o.pick}}" data-style="{{o.estilo}}">{{o.label}}</div></template>
<template data-sc="if" value="{{cb1.vacio}}" hint-placeholder-val="{{ false }}"><div style="padding: 8px 10px; font-size: 14px; color: var(--tinta2)">Sin coincidencias</div></template>
</div></template>
</div>
<div class="combo" style="position: relative">
<input id="sel-sp2" type="text" role="combobox" aria-label="{{cb2.aria}}" aria-expanded="{{cb2.abierto}}" aria-controls="lista-sp2" aria-autocomplete="list" aria-activedescendant="{{cb2.activo}}" placeholder="{{cb2.ph}}" value="{{cb2.texto}}" onInput="{{cb2.escribir}}" onClick="{{cb2.abrir}}" onKeydown="{{cb2.tecla}}" autocomplete="off" spellcheck="false" style="width: 100%; box-sizing: border-box; padding: 8px 32px 8px 10px; background: var(--papel2); border: 1px solid var(--linea); border-radius: 2px; min-height: 42px; text-overflow: ellipsis">
<span aria-hidden="true" style="position: absolute; right: 11px; top: 12px; font-size: 12px; color: var(--tinta2); pointer-events: none">▾</span>
<template data-sc="if" value="{{cb2.abierto}}" hint-placeholder-val="{{ false }}"><div id="lista-sp2" role="listbox" style="position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 2px); max-height: 340px; overflow: auto; background: var(--papel2); border: 1px solid var(--linea); border-radius: 2px; box-shadow: 0 4px 12px rgba(43, 36, 29, 0.18)">
<template data-sc="for" list="{{cb2.items}}" as="o" hint-placeholder-count="6"><div id="{{o.dom}}" role="option" aria-selected="{{o.on}}" onClick="{{o.pick}}" data-style="{{o.estilo}}">{{o.label}}</div></template>
<template data-sc="if" value="{{cb2.vacio}}" hint-placeholder-val="{{ false }}"><div style="padding: 8px 10px; font-size: 14px; color: var(--tinta2)">Sin coincidencias</div></template>
</div></template>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: var(--fDatos); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta2)">Filtrar</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{grupos}}" as="g" hint-placeholder-count="3"><button type="button" onClick="{{g.pick}}" aria-pressed="{{g.on}}" data-style="{{g.estilo}}">{{g.label}}</button></template></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{catsUI}}" as="c" hint-placeholder-count="3"><button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" data-style="{{c.estilo}}">{{c.label}}</button></template></div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><div style="font-family: var(--fDatos); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta2)">Evolución en el tiempo</div>
<label for="rng-anio" style="font-size: 14px">{{textoAnio}}</label></div>
<div style="display: flex; gap: 8px; align-items: center">
<button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="min-width: 40px; min-height: 40px; border: 1px solid var(--linea); background: var(--papel2); border-radius: 2px; cursor: pointer">
<template data-sc="if" value="{{playing}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"></rect><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"></rect></svg></template>
<template data-sc="if" value="{{noPlaying}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2 L13 8 L4 14 Z" fill="currentColor"></path></svg></template>
</button>
<input id="rng-anio" type="range" min="2012" max="2025" step="1" value="{{anio}}" onChange="{{onAnio}}" style="flex: 1; min-width: 0">
</div>
<div style="font-family: var(--fNotas); font-size: 16px; color: var(--tintaA); line-height: 1.2">Más registros = más gente mirando, no más animales. 2025 está incompleto.</div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: var(--fDatos); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta2)">Presión de fondo</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{presUI}}" as="b" hint-placeholder-count="3"><button type="button" onClick="{{b.pick}}" aria-pressed="{{b.on}}" data-style="{{b.estilo}}">{{b.label}}</button></template></div>
<template data-sc="if" value="{{presEsAP}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 8px; border-left: 2px solid var(--linea); padding-left: 10px">
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{apTipoUI}}" as="b" hint-placeholder-count="2"><button type="button" onClick="{{b.pick}}" aria-pressed="{{b.on}}" data-style="{{b.estilo}}">{{b.label}}</button></template></div>
<div style="font-size: 13px; color: var(--tinta2)">Una celda cuenta como protegida si tiene:</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{umbralUI}}" as="b" hint-placeholder-count="3"><button type="button" onClick="{{b.pick}}" aria-pressed="{{b.on}}" data-style="{{b.estilo}}">{{b.label}}</button></template></div>
<template data-sc="if" value="{{hayGap}}" hint-placeholder-val="{{ false }}"><details style="font-size: 14px"><summary style="cursor: pointer; color: var(--tintaA)">{{gapTitulo}}</summary>
<div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; max-height: 200px; overflow: auto"><template data-sc="for" list="{{gapLista}}" as="g" hint-placeholder-count="6"><button type="button" onClick="{{g.pick}}" style="font-size: 12px; padding: 3px 7px; border: 1px solid var(--linea); background: var(--papel); border-radius: 2px; cursor: pointer">{{g.t}}</button></template></div>
</details></template>
</div></template>
<div style="font-size: 13px; color: var(--tinta2)">{{presNota}}</div>
</section>
<section style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: var(--fDatos); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta2)">Celdas</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-sc="for" list="{{formaUI}}" as="b" hint-placeholder-count="2"><button type="button" onClick="{{b.pick}}" aria-pressed="{{b.on}}" data-style="{{b.estilo}}">{{b.label}}</button></template></div>
<div style="font-size: 13px; color: var(--tinta2)">{{formaNota}}</div>
</section>
</aside>
<main style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column">
<div style="position: relative; border: 1px solid var(--linea); background: var(--papel2); height: 680px">
<div ref="{{mapRef}}" style="position: absolute; inset: 0"></div>
<template data-sc="if" value="{{cargando}}" hint-placeholder-val="{{ true }}"><div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--fNotas); font-size: 24px; color: var(--tinta2)">Siguiendo huellas…</div></template>
<div style="position: absolute; inset: 0; pointer-events: none; z-index: 4">
<template data-sc="if" value="{{guia.visible}}" hint-placeholder-val="{{ true }}">
<section class="tarjeta-mapa tarjeta-guia" aria-labelledby="guia-titulo">
<button type="button" class="tarjeta-cab" style="width: 100%" onClick="{{toggleGuia}}" aria-expanded="{{guia.abierta}}" aria-controls="guia-cuerpo" title="Mostrar u ocultar la guía">
<span id="guia-titulo" style="font-family: var(--fTitulo); font-size: 19px; line-height: 1.1">Cómo leer este mapa</span>
<span class="tarjeta-signo" aria-hidden="true">{{guia.signo}}</span>
</button>
<template data-sc="if" value="{{guia.abierta}}" hint-placeholder-val="{{ true }}">
<ol id="guia-cuerpo" style="margin: 0; padding: 8px 14px 12px 32px; border-top: 1px dotted var(--linea); display: flex; flex-direction: column; gap: 5px; font-size: 13px; line-height: 1.35">
<li>Cada punto es una celda del territorio (~1.800 km²): cuanto más grande y oscuro, más especies amenazadas registradas ahí en la ventana de tiempo elegida.</li>
<li>Buscá una especie por nombre para ver su ficha y dónde fue registrada; sumá una segunda para comparar en dos tintas.</li>
<li>Mové el año o tocá ▶ para ver cómo cambian los registros. Con "Ver acumulado" se suman desde 2012.</li>
<li>En "Presión de fondo" pintá áreas protegidas o focos de calor debajo de los registros. Clic en una ecorregión: su ficha.</li>
<li>Los registros miden dónde se miró, no cuántos animales hay. Los vacíos también son un dato.</li>
</ol>
</template>
</section>
</template>
<template data-sc="if" value="{{ficha.esEspecie}}" hint-placeholder-val="{{ false }}">
<article class="tarjeta-mapa tarjeta-ficha" aria-label="Ficha de la especie elegida">
<div style="display: flex; align-items: stretch">
<button type="button" class="tarjeta-cab" onClick="{{toggleFicha}}" aria-expanded="{{fichaCard.abierta}}" title="Mostrar u ocultar la ficha">
<span style="min-width: 0"><span style="display: block; font-family: var(--fDatos); font-size: 10px; letter-spacing: 0.04em; color: var(--tinta2)">LISTA ROJA · {{ficha.catalogo}}</span><span style="display: block; font-family: var(--fTitulo); font-size: 21px; line-height: 1.1">{{ficha.comun}}</span></span>
<span class="tarjeta-signo" aria-hidden="true">{{fichaCard.signo}}</span>
</button>
<button type="button" class="tarjeta-x" onClick="{{limpiarSp}}" aria-label="Volver al conjunto" title="Volver al conjunto">✕</button>
</div>
<template data-sc="if" value="{{fichaCard.abierta}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 8px 12px 12px; border-top: 1px dotted var(--linea)">
<div style="font-style: italic; font-size: 16px">{{ficha.cientifico}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span data-style="{{ficha.selloNac}}">{{ficha.nacTxt}}</span>
<span data-style="{{ficha.selloUicn}}">{{ficha.uicnTxt}}</span>
</div>
<div style="font-size: 13px; color: var(--tinta2)">{{ficha.grupo}}{{ficha.marino}}</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; border-top: 1px dotted var(--linea); padding-top: 8px">
<div><div style="font-family: var(--fTitulo); font-size: 22px; line-height: 1.1">{{ficha.n}}</div><div style="font-size: 12px; color: var(--tinta2)">registros 2012–2025</div></div>
<div><div style="font-family: var(--fTitulo); font-size: 22px; line-height: 1.1">{{ficha.nh}}</div><div style="font-size: 12px; color: var(--tinta2)">hexágonos con registro</div></div>
</div>
<div>
<div style="font-size: 12px; color: var(--tinta2); margin-bottom: 4px">Detectada por año (2012 → 2025)</div>
<div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 2px; height: 26px">
<template data-sc="for" list="{{ficha.barras}}" as="b" hint-placeholder-count="14">
<span title="{{b.t}}" data-style="{{b.estilo}}"></span>
</template>
</div>
</div>
<div style="font-size: 13px"><b>Ecorregiones:</b> {{ficha.ecos}}</div>
<div style="font-size: 12px; color: var(--tinta2)">{{ficha.rango}}</div>
<div style="font-family: var(--fNotas); font-size: 17px; color: var(--tintaA); line-height: 1.2">{{ficha.nota}}</div>
<button type="button" onClick="{{limpiarSp}}" style="align-self: flex-start; min-height: 36px; padding: 4px 12px; border: 1px solid var(--linea); background: var(--papel); border-radius: 2px; cursor: pointer">Volver al conjunto</button>
</div>
</template>
</article>
</template>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px 36px; align-items: flex-start; border: 1px solid var(--linea); border-top: 0; background: var(--papel2); padding: 10px 14px; font-size: 13px">
<div style="display: flex; flex-direction: column; gap: 5px; min-width: 220px">
<div style="font-family: var(--fDatos); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta2)">{{leyenda.titulo}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center"><template data-sc="for" list="{{leyenda.items}}" as="it" hint-placeholder-count="4"><span style="display: flex; gap: 6px; align-items: center"><span data-style="{{it.muestra}}"></span><span>{{it.label}}</span></span></template></div>
<div style="color: var(--tinta2)">{{leyenda.nota}}</div>
</div>
<template data-sc="if" value="{{leyP.on}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 5px; min-width: 240px">
<div style="font-family: var(--fDatos); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta2)">{{leyP.titulo}}</div>
<div style="display: flex; gap: 2px; width: 260px"><template data-sc="for" list="{{leyP.items}}" as="it" hint-placeholder-count="5"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 11px; font-family: var(--fDatos)"><span data-style="{{it.muestra}}"></span><span>{{it.label}}</span></div></template></div>
<div style="color: var(--tinta2)">Debajo de los puntos de especies.</div>
</div>
</template>
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px; text-align: right; color: var(--tinta2)">
<span style="font-size: 14px; color: var(--tinta)">{{estado}}</span>
<span>Clic en una ecorregión: su ficha · cursor: detalle · rueda o pellizco: zoom</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 14px">
<template data-sc="if" value="{{ficha.noEco}}" hint-placeholder-val="{{ true }}">
<article style="border: 1px dashed var(--linea); padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-size: 14px; color: var(--tinta2)">
<div style="font-family: var(--fTitulo); font-size: 22px; color: var(--tinta)">Ficha de ecorregión</div>
<div>Hacé clic en una ecorregión del mapa para ver su ficha acá. La ficha de cada especie aparece sobre el mapa, al elegirla en el buscador.</div>
</article>
</template>
</div>
</main>
</div>
<template data-sc="if" value="{{ficha.esEco}}" hint-placeholder-val="{{ false }}">
<article style="background: var(--papel2); border: 1px solid var(--tinta); outline: 1px solid var(--linea); outline-offset: 3px; padding: 14px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 24px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: var(--fDatos); font-size: 11px; color: var(--tinta2)">ECORREGIÓN · {{ficha.ecoId}}</div>
<h2 style="margin: 0; font-family: var(--fTitulo); font-weight: 400; font-size: 26px; line-height: 1.05">{{ficha.ecoNombre}}</h2>
<div style="font-size: 13px; color: var(--tinta2)">{{ficha.ecoArea}} km² · RESOLVE: {{ficha.ecoOrig}}</div>
<button type="button" onClick="{{limpiarEco}}" style="align-self: flex-start; min-height: 34px; padding: 4px 12px; border: 1px solid var(--linea); background: var(--papel); border-radius: 2px; cursor: pointer">Cerrar ficha</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center">
<div><div style="font-family: var(--fTitulo); font-size: 24px; line-height: 1.1">{{ficha.ecoCR}}</div><div style="font-size: 11px">en peligro crítico</div></div>
<div><div style="font-family: var(--fTitulo); font-size: 24px; line-height: 1.1">{{ficha.ecoEN}}</div><div style="font-size: 11px">en peligro</div></div>
<div><div style="font-family: var(--fTitulo); font-size: 24px; line-height: 1.1">{{ficha.ecoVU}}</div><div style="font-size: 11px">amenazadas</div></div>
</div>
<div style="font-size: 12px; color: var(--tinta2)">Especies detectadas cada año (todas las amenazadas)</div>
<div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; align-items: end; height: 52px">
<template data-sc="for" list="{{ficha.ecoSerie}}" as="b" hint-placeholder-count="14">
<span title="{{b.t}}" data-style="{{b.estilo}}"></span>
</template>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; max-height: 130px; overflow: auto"><b>Con registros (según filtros):</b> {{ficha.ecoEspecies}}</div>
<div style="font-size: 11px; color: var(--tinta2)">Desmonte (MapBiomas) usa otro mapa de ecorregiones (Burkart): ver la pestaña «Presiones».</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div><div style="font-family: var(--fTitulo); font-size: 22px; line-height: 1.1">{{ficha.ecoAP}}</div><div style="font-size: 11px; color: var(--tinta2)">bajo área protegida en {{ficha.ecoAnio}} ({{ficha.ecoAPe}} estricta)</div></div>
<div><div style="font-family: var(--fTitulo); font-size: 22px; line-height: 1.1">{{ficha.ecoFu}}</div><div style="font-size: 11px; color: var(--tinta2)">focos de calor VIIRS por 1.000 km² y año ({{ficha.ecoVent}})</div></div>
</div>
<div style="font-size: 12px; color: var(--tinta2)">Focos de calor por año, 2012 → 2025</div>
<div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; align-items: end; height: 36px">
<template data-sc="for" list="{{ficha.ecoFuSerie}}" as="b" hint-placeholder-count="14">
<span title="{{b.t}}" data-style="{{b.estilo}}"></span>
</template>
</div>
</div>
</article>
</template>
<div id="sec-ficha" style="display: flex; align-items: center; gap: 12px; margin-top: 8px; scroll-margin-top: 56px; font-family: var(--fDatos); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--tinta2)"><span style="color: var(--tintaA)">02</span><span>Ficha y años</span><span style="flex: 1; height: 1px; background: var(--linea)"></span></div><div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 3 1 560px; min-width: 0"><section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline">

</div>

<div title="{{b.t}}" data-style="{{b.estilo}}"></div>
</div>
</template>
</div>
<div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 6px">

<button type="button" onClick="{{b.pick}}" data-style="{{b.etq}}">{{b.anio}}<br><span style="font-size: 11px">{{b.sp}}</span></button>
</template>
</div>
</section></div>
</div>
<div id="sec-tablas" style="display: flex; align-items: center; gap: 12px; margin-top: 8px; scroll-margin-top: 56px; font-family: var(--fDatos); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--tinta2)"><span style="color: var(--tintaA)">03</span><span>Tablas, presiones y fuentes</span><span style="flex: 1; height: 1px; background: var(--linea)"></span></div>
<section style="border-top: 1px solid var(--linea); padding-top: 14px; display: flex; flex-direction: column; gap: 14px">

<template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="4">

<template data-sc="if" value="{{tab.catalogo}}" hint-placeholder-val="{{ true }}">

<template data-sc="for" list="{{ordenes}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" data-style="{{o.estilo}}">{{o.label}}</button>
</template>

</div>

<td style="padding: 6px 8px; text-align: right; font-family: var(--fDatos)">{{r.n}}</td>
<td style="padding: 6px 8px; text-align: right; font-family: var(--fDatos)">{{r.ne}}</td>
<td style="padding: 6px 8px"><div style="display: grid; grid-template-columns: repeat(14, 6px); gap: 1px; height: 14px"><template data-sc="for" list="{{r.code}}" as="c" hint-placeholder-count="14"><span data-style="{{c.estilo}}"></span></template></div></td>
</tr>
</template>
</tbody>
</table>
</div>
</template>

<template data-sc="if" value="{{tab.vacias}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; max-width: 820px">Estas {{vaciasN}} especies están en la lista roja nacional pero no tienen ningún registro georreferenciado en GBIF entre 2012 y 2025 (con los filtros actuales). No significa que no existan: significa que no sabemos dónde están.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px">
<template data-sc="for" list="{{vacias}}" as="v" hint-placeholder-count="8">
<button type="button" onClick="{{v.pick}}" style="background: var(--papel2); border: 1px solid var(--linea); outline: 1px dashed var(--linea); outline-offset: -8px; padding: 16px; display: flex; flex-direction: column; justify-content: flex-start; text-align: left; gap: 4px; cursor: pointer">
<span style="font-family: var(--fDatos); font-size: 10px; color: var(--tinta2)">{{v.cat}}</span>
<span style="font-family: var(--fTitulo); font-size: 18px; line-height: 1.1">{{v.com}}</span>
<span style="font-style: italic; font-size: 13px; color: var(--tinta2)">{{v.cie}}</span>
<span data-style="{{v.sello}}">{{v.nac}}</span>
<span style="font-size: 11px; color: var(--tinta2)">{{v.rg}}</span>
</button>
</template>
</div>
</template>


<template data-sc="if" value="{{tab.presiones}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; max-width: 900px">Tres presiones medidas con fuentes abiertas. Las dos primeras usan las mismas ecorregiones que el mapa (RESOLVE); la pérdida de vegetación nativa viene ya agregada por MapBiomas sobre las ecorregiones de Burkart, que no coinciden una a una con las RESOLVE.</p>
<div style="overflow-x: auto; border: 1px solid var(--linea)">
<table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px">
<thead><tr style="background: var(--papel2); text-align: left; font-family: var(--fDatos); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase">
<th style="padding: 8px">Ecorregión (RESOLVE)</th><th style="padding: 8px; text-align: right">km²</th><th style="padding: 8px; text-align: right">Especies con registro</th><th style="padding: 8px; text-align: right">% bajo AP 2025</th><th style="padding: 8px; text-align: right">% estricta</th><th style="padding: 8px; text-align: right">Focos / 1.000 km² / año</th><th style="padding: 8px">Focos 2012 → 2025</th>
</tr></thead>
<tbody>
<template data-sc="for" list="{{presTabla}}" as="r" hint-placeholder-count="8">
<tr onClick="{{r.pick}}" style="border-top: 1px dotted var(--linea); cursor: pointer">
<td style="padding: 6px 8px">{{r.nom}}</td><td style="padding: 6px 8px; text-align: right; font-family: var(--fDatos)">{{r.km2}}</td><td style="padding: 6px 8px; text-align: right; font-family: var(--fDatos)">{{r.sp}}</td><td style="padding: 6px 8px; text-align: right; font-family: var(--fDatos)">{{r.ap}}</td><td style="padding: 6px 8px; text-align: right; font-family: var(--fDatos)">{{r.ape}}</td><td style="padding: 6px 8px; text-align: right; font-family: var(--fDatos)">{{r.fu}}</td>
<td style="padding: 6px 8px"><div style="display: grid; grid-template-columns: repeat(14, 6px); gap: 1px; height: 18px; align-items: end"><template data-sc="for" list="{{r.serie}}" as="c" hint-placeholder-count="14"><span data-style="{{c.estilo}}"></span></template></div></td>
</tr>
</template>
</tbody>
</table>
</div>
<h3 style="margin: 8px 0 0; font-family: var(--fTitulo); font-weight: 400; font-size: 22px">Vegetación nativa perdida, 2012 → 2025 (MapBiomas, ecorregiones de Burkart)</h3>
<div style="overflow-x: auto; border: 1px solid var(--linea)">
<table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px">
<thead><tr style="background: var(--papel2); text-align: left; font-family: var(--fDatos); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase">
<th style="padding: 8px">Ecorregión (Burkart)</th><th style="padding: 8px; text-align: right">Bosque 2012 (mil ha)</th><th style="padding: 8px; text-align: right">Cambio bosque</th><th style="padding: 8px; text-align: right">Cambio veg. natural</th><th style="padding: 8px; text-align: right">Cambio uso agropecuario</th><th style="padding: 8px">Bosque 2012 → 2025</th>

</tr>
</template>
</tbody>
</table>
</div>
<div style="font-size: 13px; color: var(--tinta2); max-width: 900px"> MapBiomas: el salto de 2024 a 2025 y la ganancia de vegetación natural en la Pampa pueden reflejar cambios de clasificación entre pasturas y pastizales (leer con cuidado). Áreas protegidas: Tomba (2025) no incluye áreas creadas después de 2022.</div>
</template>

<template data-sc="if" value="{{tab.fuentes}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; font-size: 14px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-family: var(--fTitulo); font-weight: 400; font-size: 22px">Fuentes de esta versión</h3>
<p style="margin: 0">Mamíferos: Ministerio de Ambiente y Desarrollo Sostenible (2021). Res. 316/2021, Anexo I. <a href="https://www.argentina.gob.ar/normativa/nacional/norma-354496/texto">argentina.gob.ar</a></p>
<p style="margin: 0">Aves: Ministerio de Ambiente y Desarrollo Sustentable (2017). Res. 795/2017, Anexos I y II. <a href="https://www.argentina.gob.ar/normativa/nacional/norma-287278/texto">argentina.gob.ar</a></p>
<p style="margin: 0">Registros: GBIF.org (29/10/2026) GBIF Occurrence Download <a href="https://doi.org/10.15468/dl.t87f4d">doi:10.15468/dl.t87f4d</a> · 51 conjuntos de datos, CC BY-NC 4.0.</p>
<p style="margin: 0">Categoría UICN global: UICN, Lista Roja, vía API de GBIF (29/10/2026).</p>
<p style="margin: 0">Ecorregiones: Dinerstein, E. et al. (2017) <i>BioScience</i> 67(6) <a href="https://doi.org/10.1093/biosci/bix014">doi:10.1093/biosci/bix014</a>, CC BY 4.0.</p>
<p style="margin: 0">Provincias: INDEC, Códigos geográficos, vía geoAr (Ruiz Nicolini, MIT).</p>
<p style="margin: 0">Relieve: NOAA National Centers for Environmental Information (2022). <i>ETOPO 2022 15 Arc-Second Global Relief Model</i> <a href="https://doi.org/10.25921/fd45-gt74">doi:10.25921/fd45-gt74</a>, dominio público (versión de 30″, sombreado propio).</p>
<p style="margin: 0">Áreas protegidas: Tomba, A. (2025). <i>Georeferenced database of Argentina's protected areas system</i>. Mendeley Data, V1. <a href="https://doi.org/10.17632/wggsh3dszp.1">doi:10.17632/wggsh3dszp.1</a>, CC BY 4.0.</p>
<p style="margin: 0">Focos de calor: NASA FIRMS, VIIRS S-NPP 375 m, resúmenes anuales por país (procesamiento estándar). <a href="https://firms.modaps.eosdis.nasa.gov/country/">firms.modaps.eosdis.nasa.gov/country</a>.</p>
<p style="margin: 0">Vegetación nativa: MapBiomas Argentina, Colección 3, estadísticas por ecorregión. <a href="https://argentina.mapbiomas.org/descargas/estadisticas/">argentina.mapbiomas.org</a>, CC BY 4.0.</p>
<p style="margin: 0">Rangos expertos de mamíferos: Marsh, C. J. et al. (2022). <i>Journal of Biogeography</i> 49(5): 979–992, <a href="https://doi.org/10.1111/jbi.14330">doi:10.1111/jbi.14330</a>; mapas MDD v1.2 en <a href="https://zenodo.org/records/6644198">Zenodo 6644198</a>, CC BY 4.0. Procesados: Cingulata, Pilosa, Perissodactyla, Didelphimorphia, Microbiotheria, Paucituberculata y Primates.</p>
<p style="margin: 0">Mapa: MapLibre GL JS 5.24.0 (BSD-3).</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-family: var(--fTitulo); font-weight: 400; font-size: 22px">Método, en resumen</h3>
<p style="margin: 0">205 especies amenazadas según las listas nacionales: en peligro crítico, en peligro y "amenazada" (equivale a VU de UICN). La "vulnerable" nacional (≈ NT) no se incluye.</p>
<p style="margin: 0">Registros GBIF 2012–2025 con coordenadas, sin problemas geoespaciales, con incertidumbre ≤ 30 km. Se quitan duplicados (misma especie, punto y fecha): quedan {{k.registros}}.</p>
<p style="margin: 0">Agregación en hexágonos H3 de resolución 4 y en ecorregiones RESOLVE recortadas a Argentina.</p>
<p style="margin: 0">Un registro es una detección, no un individuo. El crecimiento anual refleja más observadores (eBird aporta ~92 %). 2025 está incompleto.</p>
</div>
</div>
</template>

      vaciosUI: [[false, 'Todas las celdas'], [true, 'Solo los vacíos']].map(([v, l]) => ({ label: l, on: s.soloVacios === v, estilo: this.pill(s.soloVacios === v, C), pick: () => this.setState({ soloVacios: v }) })),
      gapLista: gap && gap.nunca ? gap.nuncaNom.sort((a, b) => ({ CR: 0, EN: 1, VU: 2 })[a.nac] - ({ CR: 0, EN: 1, VU: 2 })[b.nac] || b.n - a.n).slice(0, 40).map((e) => ({ t: e.com + ' (' + e.nac + ')', pick: () => this.setState({ sp: e.id, panel: 'ficha' }) })) : [],
      gapTitulo: gap ? gap.nunca + ' especies sin registros dentro de celdas protegidas' : '', hayGap: !!(gap && gap.nunca),
      indice: [['sec-mensaje', 'Mensaje'], ['sec-mapa', 'Mapa'], ['sec-ficha', 'Ficha y años'], ['sec-tablas', 'Catálogo', 'catalogo'], ['sec-tablas', 'Sin huellas', 'vacias'], ['sec-tablas', 'Presiones', 'presiones'], ['sec-tablas', 'Fuentes', 'fuentes']].map(([id, l, tab], i) => ({ n: String(i).padStart(2, '0'), label: l, pick: () => this.irA(id, tab) })),

      presUI, apTipoUI, presEsAP: s.pres === 'ap', presNota, leyP, presTabla, mbTabla, aplOn: !!s.capas.apl, aplToggle: () => this.setState({ capas: Object.assign({}, s.capas, { apl: !s.capas.apl }) }),
      tab: { presiones: s.tab === 'presiones', catalogo: s.tab === 'catalogo', vacias: s.tab === 'vacias', fuentes: s.tab === 'fuentes' },
      ordenes, catalogo, catalogoN: catalogo.length, vacias, vaciasN: vacias.length
    });
  }
}
